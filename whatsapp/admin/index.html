<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Admin Console</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #1f2937; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0f172a; color: #fff; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.online { background: #10b981; }
    .dot.offline { background: #ef4444; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; }
    button.secondary { background: #111827; color: #e5e7eb; }
    button.danger { background: #dc2626; }
    main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 56px); }
    .sidebar { border-right: 1px solid #e5e7eb; background: #fff; overflow: auto; }
    .search { padding: 10px; border-bottom: 1px solid #e5e7eb; }
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>WhatsApp Admin</title>
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; background: radial-gradient(circle at 20% 20%, #0f172a 0, #0f172a 20%, #0b1222 45%, #0b1020 75%, #0a0f1d 100%); color: #e2e8f0; min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 10; }
        .brand { font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
        .glow { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 12px rgba(16,185,129,0.8); }
        .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #cbd5e1; }
        .status-label { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.06); }
        .actions { display: flex; gap: 10px; align-items: center; }
        button { cursor: pointer; padding: 10px 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; font-weight: 700; letter-spacing: 0.2px; box-shadow: 0 10px 25px rgba(59,130,246,0.25); transition: transform 0.08s ease, box-shadow 0.08s ease; }
        button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(59,130,246,0.32); }
        button.secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; box-shadow: none; border: 1px solid rgba(255,255,255,0.08); }
        button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 10px 25px rgba(239,68,68,0.2); }
        main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 64px); }
        .sidebar { background: rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.08); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .search { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
        .search input { flex: 1; background: transparent; border: none; color: #e2e8f0; outline: none; font-size: 14px; }
        .chat-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
        .chat-item { padding: 12px 12px; border-radius: 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px; transition: background 0.1s ease, transform 0.1s ease; border: 1px solid transparent; }
        .chat-item:hover { background: rgba(255,255,255,0.04); transform: translateY(-1px); }
        .chat-item.active { background: rgba(37,99,235,0.12); border-color: rgba(37,99,235,0.35); }
        .chat-name { font-weight: 700; color: #e2e8f0; }
        .chat-preview { color: #94a3b8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-ts { color: #64748b; font-size: 11px; }
        .content { display: grid; grid-template-rows: auto 1fr auto; height: 100%; background: rgba(255,255,255,0.02); }
        .conversation-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }
        .thread { overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 12px 14px; border-radius: 14px; position: relative; color: #e2e8f0; background: rgba(255,255,255,0.06); backdrop-filter: blur(6px); align-self: flex-start; }
        .msg.out { background: linear-gradient(135deg, #2563eb, #3b82f6); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.in { border-bottom-left-radius: 4px; }
        .msg-meta { margin-top: 6px; font-size: 11px; color: rgba(226,232,240,0.75); }
        .empty { color: #94a3b8; text-align: center; padding: 20px; }
        .composer { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }
        .composer textarea { flex: 1; resize: none; min-height: 52px; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #e2e8f0; }
        .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
        .qr-card { background: #0f172a; padding: 24px; border-radius: 14px; width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); }
        .qr-card img { width: 280px; border-radius: 10px; }
        .login-overlay { position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(59,130,246,0.25), transparent 40%), radial-gradient(circle at 80% 0%, rgba(99,102,241,0.18), transparent 35%), #0b1224; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { width: 380px; background: rgba(15,23,42,0.95); color: #e2e8f0; padding: 28px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px; }
        .login-card h2 { margin: 0; font-size: 22px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 700; font-size: 13px; color: #cbd5e1; }
        .form-group input { padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e2e8f0; }
        .error { color: #f87171; font-size: 13px; min-height: 18px; }
        .chip { padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.08); font-weight: 700; }
      </style>
    </head>
    <body>
      <div id="login-overlay" class="login-overlay" style="display:none;">
        <div class="login-card">
          <h2>WhatsApp Admin</h2>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input id="login-username" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" />
          </div>
          <div class="error" id="login-error"></div>
          <div class="actions" style="width:100%; justify-content: space-between;">
            <button id="login-btn">Sign In</button>
            <button id="signup-btn" class="secondary" type="button">Create Admin</button>
            <button id="login-demo" class="secondary" type="button">Demo Fill</button>
          </div>
        </div>
      </div>

      <header>
        <div class="brand">
          <div class="glow" id="status-dot"></div>
          <div>
            <div style="font-size:16px;">YouLearnt WA Console</div>
            <div id="status-text" class="status">Offline</div>
          </div>
        </div>
        <div class="actions">
          <div id="user-chip" class="chip">Guest</div>
          <button id="show-qr">Show QR</button>
          <button id="unlink" class="secondary">Unlink / Relink</button>
          <button id="logout" class="danger">Logout</button>
        </div>
      </header>

      <main>
        <aside class="sidebar">
          <div class="search"><input id="search" placeholder="Search chats" /></div>
          <ul id="chat-list" class="chat-list"></ul>
        </aside>
        <section class="content">
          <div class="conversation-header">
            <div>
              <div id="active-chat-name" style="font-weight:700;">Select a chat</div>
              <div id="active-chat-meta" style="font-size:12px; color:#94a3b8;">Waiting for selection</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button id="backfill-btn" class="secondary" disabled>Backfill 30d</button>
              <button id="mute-btn" class="secondary" disabled>Mute AI</button>
            </div>
          </div>
          <div id="thread" class="thread">
            <div id="empty-state" class="empty">Select a chat to view messages</div>
          </div>
          <div class="composer">
            <textarea id="composer-input" placeholder="Type a reply..." disabled></textarea>
            <button id="send" disabled>Send</button>
          </div>
        </section>
      </main>

      <div id="qr-modal" class="qr-modal">
        <div class="qr-card">
          <h3 style="margin:0 0 12px;">Scan to Link WhatsApp</h3>
          <div id="qr-container">Loading...</div>
          <p style="color:#94a3b8; font-size:12px;">Refresh if it expires.</p>
          <button id="close-qr" class="secondary" style="width:100%; margin-top:8px;">Close</button>
        </div>
      </div>

      <script>
        const apiBase = '';
        let authUser = null;
        let eventSource = null;
        const state = { chats: [], activeJid: null, lastMessages: {} };

        const chatListEl = document.getElementById('chat-list');
        const threadEl = document.getElementById('thread');
        const emptyStateEl = document.getElementById('empty-state');
        const composerInput = document.getElementById('composer-input');
        const sendBtn = document.getElementById('send');
        const muteBtn = document.getElementById('mute-btn');
        const backfillBtn = document.getElementById('backfill-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const userChip = document.getElementById('user-chip');
        const loginOverlay = document.getElementById('login-overlay');
        const loginBtn = document.getElementById('login-btn');
        const loginDemo = document.getElementById('login-demo');
        const signupBtn = document.getElementById('signup-btn');
        const loginError = document.getElementById('login-error');
        const loginUsername = document.getElementById('login-username');
        const loginPassword = document.getElementById('login-password');
        const showQrBtn = document.getElementById('show-qr');
        const qrModal = document.getElementById('qr-modal');
        const qrContainer = document.getElementById('qr-container');
        const closeQr = document.getElementById('close-qr');
        const logoutBtn = document.getElementById('logout');
        const unlinkBtn = document.getElementById('unlink');
        const searchInput = document.getElementById('search');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatMeta = document.getElementById('active-chat-meta');

        async function fetchJson(path, opts = {}) {
          const res = await fetch(apiBase + path, {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
            ...opts,
          });
          if (!res.ok) {
            let msg = 'Request failed';
            try { const body = await res.json(); msg = body.error || msg; } catch (e) { /* ignore */ }
            const err = new Error(msg);
            err.status = res.status;
            throw err;
          }
          try { return await res.json(); } catch (e) { return {}; }
        }

        function setStatus(connection) {
          const online = connection === 'open' || connection === 'online';
          statusDot.style.background = online ? '#10b981' : '#ef4444';
          statusDot.style.boxShadow = online ? '0 0 12px rgba(16,185,129,0.8)' : '0 0 12px rgba(239,68,68,0.6)';
          statusText.textContent = connection || 'offline';
        }

        function renderChats() {
          const q = searchInput.value.trim().toLowerCase();
          chatListEl.innerHTML = '';
          state.chats
            .filter((c) => !q || (c.name || '').toLowerCase().includes(q) || c.jid.toLowerCase().includes(q))
            .forEach((chat) => {
              const li = document.createElement('li');
              li.className = 'chat-item' + (state.activeJid === chat.jid ? ' active' : '');
              li.onclick = () => selectChat(chat.jid);
              li.innerHTML = `
                <div>
                  <div class="chat-name">${chat.name || chat.jid}${chat.muted ? ' (muted)' : ''}</div>
                  <div class="chat-preview">${chat.lastMessage || ''}</div>
                </div>
                <div class="chat-ts">${chat.lastTs ? new Date(chat.lastTs).toLocaleString() : ''}</div>
              `;
              chatListEl.appendChild(li);
            });
        }

        function renderMessages(messages) {
          threadEl.innerHTML = '';
          if (!messages.length) {
            emptyStateEl.style.display = 'block';
            threadEl.appendChild(emptyStateEl);
            return;
          }
          emptyStateEl.style.display = 'none';
          messages.forEach((m) => {
            const div = document.createElement('div');
            div.className = 'msg ' + (m.fromMe ? 'out' : 'in');
            div.innerHTML = `<div>${escapeHtml(m.text || '')}</div><div class="msg-meta">${new Date(m.ts || m.timestamp).toLocaleString()}</div>`;
            threadEl.appendChild(div);
          });
          threadEl.scrollTop = threadEl.scrollHeight;
        }

        async function loadChats() {
          const res = await fetchJson('/api/chats');
          state.chats = res.chats || [];
          renderChats();
        }

        async function loadMessages(jid) {
          const res = await fetchJson(`/api/chats/${encodeURIComponent(jid)}/messages?limit=100`);
          const messages = (res.messages || []).slice().reverse();
          state.lastMessages[jid] = messages;
          renderMessages(messages);
        }

        async function selectChat(jid) {
          state.activeJid = jid;
          const chat = state.chats.find((c) => c.jid === jid);
          composerInput.disabled = false;
          sendBtn.disabled = false;
          muteBtn.disabled = false;
          backfillBtn.disabled = false;
          activeChatName.textContent = chat?.name || jid;
          activeChatMeta.textContent = chat ? (chat.lastTs ? new Date(chat.lastTs).toLocaleString() : '') : '';
          renderChats();
          await loadMessages(jid);
          updateMuteButton();
        }

        async function sendMessage() {
          if (!state.activeJid) return;
          const text = composerInput.value.trim();
          if (!text) return;
          composerInput.value = '';
          await fetchJson(`/api/chats/${encodeURIComponent(state.activeJid)}/send`, {
            method: 'POST',
            body: JSON.stringify({ text }),
          });
          await loadMessages(state.activeJid);
        }

        async function toggleMute() {
          if (!state.activeJid) return;
          const chat = state.chats.find((c) => c.jid === state.activeJid);
          const nextMuted = !(chat && chat.muted);
          await fetchJson(`/api/chats/${encodeURIComponent(state.activeJid)}/mute`, {
            method: 'POST',
            body: JSON.stringify({ muted: nextMuted }),
          });
          await loadChats();
          updateMuteButton();
        }

        async function backfill() {
          if (!state.activeJid) return;
          backfillBtn.textContent = 'Backfilling...';
          backfillBtn.disabled = true;
          try {
            await fetchJson(`/api/chats/${encodeURIComponent(state.activeJid)}/backfill`, {
              method: 'POST',
              body: JSON.stringify({ days: 30 }),
            });
            await loadMessages(state.activeJid);
          } catch (e) {
            alert('Backfill failed');
          } finally {
            backfillBtn.textContent = 'Backfill 30d';
            backfillBtn.disabled = false;
          }
        }

        function connectEvents() {
          eventSource?.close();
          eventSource = new EventSource(apiBase + '/api/events', { withCredentials: true });
          eventSource.onmessage = async (evt) => {
            try {
              const payload = JSON.parse(evt.data);
              if (payload.type === 'status') setStatus(payload.data?.connection);
              if (payload.type === 'message') {
                const jid = payload.data?.jid;
                await loadChats();
                if (state.activeJid === jid) await loadMessages(jid);
              }
              if (payload.type === 'qr') showQr(payload.data?.qr);
            } catch (err) {
              console.error('Event parse failed', err);
            }
          };
          eventSource.onerror = () => setStatus('offline');
        }

        async function bootstrap() {
          await loadChats();
          try { const s = await fetchJson('/api/status'); setStatus(s.connection || s.status); } catch (e) { setStatus('offline'); }
          connectEvents();
        }

        async function checkSession() {
          try {
            const res = await fetchJson('/api/me');
            if (res.user) {
              authUser = res.user;
              userChip.textContent = authUser.username;
              loginOverlay.style.display = 'none';
              await bootstrap();
              return;
            }
          } catch (e) { /* not logged in */ }
          loginOverlay.style.display = 'flex';
        }

        function updateMuteButton() {
          const chat = state.chats.find((c) => c.jid === state.activeJid);
          const muted = chat?.muted;
          muteBtn.textContent = muted ? 'Unmute AI' : 'Mute AI';
        }

        function escapeHtml(str) {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return str.replace(/[&<>"']/g, (c) => map[c] || c);
        }

        function showQr(dataUrl) {
          qrContainer.innerHTML = dataUrl ? `<img src="${dataUrl}" alt="QR Code" />` : 'No QR available';
          qrModal.style.display = 'flex';
        }

        function hookEvents() {
          sendBtn.onclick = sendMessage;
          composerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
          muteBtn.onclick = toggleMute;
          backfillBtn.onclick = backfill;
          showQrBtn.onclick = async () => {
            qrContainer.textContent = 'Loading...';
            qrModal.style.display = 'flex';
            try { const res = await fetchJson('/api/qr'); showQr(res.qr); } catch (e) { qrContainer.textContent = 'Failed to load QR'; }
          };
          closeQr.onclick = () => { qrModal.style.display = 'none'; };
          qrModal.onclick = (e) => { if (e.target === qrModal) qrModal.style.display = 'none'; };
          unlinkBtn.onclick = async () => { await fetchJson('/api/unlink', { method: 'POST' }); setStatus('offline'); qrModal.style.display = 'none'; };
          logoutBtn.onclick = async () => {
            await fetchJson('/api/logout', { method: 'POST' });
            authUser = null;
            userChip.textContent = 'Guest';
            eventSource?.close();
            loginOverlay.style.display = 'flex';
          };
          loginDemo.onclick = () => { loginUsername.value = 'admin'; loginPassword.value = 'admin'; };
          loginBtn.onclick = async () => {
            loginError.textContent = '';
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (!username || !password) { loginError.textContent = 'Enter username and password'; return; }
            try {
              const res = await fetchJson('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
              authUser = res.user;
              userChip.textContent = authUser.username;
              loginOverlay.style.display = 'none';
              await bootstrap();
            } catch (e) { loginError.textContent = e.message || 'Invalid credentials'; }
          };
          signupBtn.onclick = async () => {
            loginError.textContent = '';
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (!username || !password) { loginError.textContent = 'Enter username and password'; return; }
            try {
              await fetchJson('/api/users', { method: 'POST', body: JSON.stringify({ username, password }) });
              loginError.textContent = 'Account created. Please sign in.';
            } catch (e) {
              loginError.textContent = e.message || 'Signup failed';
            }
          };
          searchInput.oninput = () => renderChats();
        }

        hookEvents();
        checkSession();
      </script>
    </body>
    </html>
