
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    :root[data-theme='light'] .table tr,
    :root[data-theme='light'] .table td {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='dark'] .table tr,
    :root[data-theme='dark'] .table td {
        background: #232946;
        color: #fff;
    }
    /* Responsive table theme colors */
    :root[data-theme='light'] .table {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='dark'] .table {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='light'] .table-light th {
        background: #f3f4f6 !important;
        color: #1f2937 !important;
    }
    :root[data-theme='dark'] .table-light th {
        background: #232946 !important;
        color: #fff !important;
    }
    :root[data-theme='light'] .theme-toggle i,
    :root[data-theme='light'] #admin-home-btn i {
        color: var(--primary-color) !important;
    }

    </style>
    <meta charset="UTF-8">
    <title>Admin Knowledge Base Editor</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:var(--light-bg);">
    <div class="container-fluid py-4 px-2 px-md-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="mb-0" style="font-weight:700; color:var(--primary-color); letter-spacing:1px;"><i class="fas fa-database me-2"></i> Admin <span class="highlight">DB</span> Editor</h2>
            <div class="d-flex align-items-center gap-2">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-sun"></i>
                </button>
                <button id="admin-home-btn" class="theme-toggle" type="button" title="Back to Chat" aria-label="Back to Chat">
                    <i class="fas fa-robot"></i>
                </button>
            </div>
        </div>
        <div class="card shadow-sm" style="background:var(--container-bg); color:var(--input-color); border-radius:16px;">
            <div class="card-body p-2 p-md-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
                    <h4 class="mb-0" style="font-weight:600; color:var(--primary-color);">Knowledge Base</h4>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="fas fa-plus me-1"></i> Add Q&A</button>
                </div>
                <div class="table-responsive" style="max-height:60vh; min-height:200px; overflow-y:auto;">
                    <table id="qa-table" class="table table-bordered table-hover align-middle w-100" style="background:var(--container-bg);">
                        <thead class="table-light">
                            <tr>
                                <th style="width:40px;">ID</th>
                                <th style="min-width:120px;">Question</th>
                                <th style="min-width:180px;">Answer</th>
                                <th style="width:120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Edit Q&A Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Q&A</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="edit-form-modal">
                    <div class="modal-body d-flex flex-column gap-3">
                        <input type="text" name="question" id="edit-question" class="form-control" placeholder="Question" required>
                        <textarea name="answer" id="edit-answer" class="form-control" placeholder="Answer" required style="min-height:60px;"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this Q&A?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Add Q&A Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Add New Q&A</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-form-modal">
                    <div class="modal-body d-flex flex-column gap-3">
                        <input type="text" name="question" class="form-control" placeholder="Question" required>
                        <textarea name="answer" class="form-control" placeholder="Answer" required style="min-height:60px;"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Add Q&A</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Theme toggle (same logic as index.html)
    document.getElementById('theme-toggle').addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('protoai_theme', next);
        location.reload();
    });
    // Set theme on load
    (function() {
        const theme = localStorage.getItem('protoai_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    // Home button
    document.getElementById('admin-home-btn').addEventListener('click', function() {
        window.location.href = '/';
    });
    // Q&A logic
    function fetchQA() {
        fetch('/admin/api/qa')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#qa-table tbody');
                tbody.innerHTML = '';
                data.forEach(row => {
                    tbody.innerHTML += `
                    <tr data-id="${row.ID}">
                        <td>${row.ID}</td>
                        <td><span class="question">${row.question}</span></td>
                        <td><span class="answer">${row.answer}</span></td>
                        <td class="actions">
                            <button class="edit btn btn-warning btn-sm me-1">Edit</button>
                            <button class="delete btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>`;
                });
            });
    }
    fetchQA();
    // Modal form submit
    document.getElementById('add-form-modal').onsubmit = function(e) {
        e.preventDefault();
        const form = e.target;
        fetch('/admin/api/qa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: form.question.value,
                answer: form.answer.value
            })
        }).then(() => {
            form.reset();
            fetchQA();
            var modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
            modal.hide();
        });
    };
    document.querySelector('#qa-table').onclick = function(e) {
        const tr = e.target.closest('tr');
        const id = tr?.dataset.id;
        if (e.target.classList.contains('delete')) {
            // Show confirmation modal
            window.deleteId = id;
            var deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        }
        if (e.target.classList.contains('edit')) {
            // Show edit modal and fill values
            window.editId = id;
            const q = tr.querySelector('.question').textContent;
            const a = tr.querySelector('.answer').textContent;
            document.getElementById('edit-question').value = q;
            document.getElementById('edit-answer').value = a;
            var editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }
    };

    // Edit modal form submit
    document.getElementById('edit-form-modal').onsubmit = function(e) {
        e.preventDefault();
        fetch(`/admin/api/qa/${window.editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: document.getElementById('edit-question').value,
                answer: document.getElementById('edit-answer').value
            })
        }).then(() => {
            fetchQA();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        });
    };

    // Delete modal confirm
    document.getElementById('confirm-delete-btn').onclick = function() {
        fetch(`/admin/api/qa/${window.deleteId}`, { method: 'DELETE' })
            .then(() => {
                fetchQA();
                var deleteModal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                deleteModal.hide();
            });
    };
    </script>
</body>
</html>
