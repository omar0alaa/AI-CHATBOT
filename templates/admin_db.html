
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    :root[data-theme='light'] .table tr,
    :root[data-theme='light'] .table td {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='dark'] .table tr,
    :root[data-theme='dark'] .table td {
        background: #232946;
        color: #fff;
    }
    /* Responsive table theme colors */
    :root[data-theme='light'] .table {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='dark'] .table {
        background: var(--container-bg);
        color: var(--input-color);
    }
    :root[data-theme='light'] .table-light th {
        background: #f3f4f6 !important;
        color: #1f2937 !important;
    }
    :root[data-theme='dark'] .table-light th {
        background: #232946 !important;
        color: #fff !important;
    }
    :root[data-theme='light'] .theme-toggle i,
    :root[data-theme='light'] #admin-home-btn i {
        color: var(--primary-color) !important;
    }

    </style>
    <meta charset="UTF-8">
    <title>Admin Knowledge Base Editor</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:var(--light-bg);">
    <div class="container-fluid py-4 px-2 px-md-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="mb-0" style="font-weight:700; color:var(--primary-color); letter-spacing:1px;"><i class="fas fa-database me-2"></i> Admin <span class="highlight">DB</span> Editor</h2>
            <div class="d-flex align-items-center gap-2">
                <button id="debug-toggle" class="theme-toggle" title="Toggle Debug Mode" aria-label="Toggle Debug Mode">
                    <i class="fas fa-bug"></i>
                </button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-sun"></i>
                </button>
                <button id="admin-home-btn" class="theme-toggle" type="button" title="Back to Chat" aria-label="Back to Chat">
                    <i class="fas fa-robot"></i>
                </button>
            </div>
        </div>
        <div class="card shadow-sm" style="background:var(--container-bg); color:var(--input-color); border-radius:16px;">
            <div class="card-body p-2 p-md-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 gap-2">
                    <h4 class="mb-0" style="font-weight:600; color:var(--primary-color);">Knowledge Base <span class="badge bg-primary ms-1">Multi-client</span></h4>
                    <div class="d-flex flex-column flex-md-row gap-2 align-items-stretch align-items-md-center">
                        <div class="d-flex gap-2 align-items-center">
                            <label for="client-select" class="mb-0" style="font-size:13px; color:var(--input-color);">Client</label>
                            <select id="client-select" class="form-select form-select-sm" style="min-width:180px;"></select>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <input id="new-client-id" type="text" class="form-control form-control-sm" placeholder="new_client_id" style="min-width:180px;" />
                            <button id="create-client-btn" class="btn btn-outline-primary btn-sm" type="button">Create Client</button>
                        </div>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="fas fa-plus me-1"></i> Add Q&A</button>
                    </div>
                </div>
                <div class="table-responsive" style="max-height:60vh; min-height:200px; overflow-y:auto;">
                    <table id="qa-table" class="table table-bordered table-hover align-middle w-100" style="background:var(--container-bg);">
                        <thead class="table-light">
                            <tr>
                                <th style="width:40px;">ID</th>
                                <th style="min-width:150px;">Question (EN)</th>
                                <th style="min-width:150px;">Question (AR)</th>
                                <th style="min-width:180px;">Answer (EN)</th>
                                <th style="min-width:180px;">Answer (AR)</th>
                                <th style="width:120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Edit Q&A Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Q&A</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="edit-form-modal">
                    <div class="modal-body d-flex flex-column gap-3">
                        <input type="text" name="question_EN" id="edit-question-en" class="form-control" placeholder="Question (English)" required>
                        <input type="text" name="question_AR" id="edit-question-ar" class="form-control" placeholder="Question (Arabic)" required dir="rtl">
                        <textarea name="answer_EN" id="edit-answer-en" class="form-control" placeholder="Answer (English)" required style="min-height:60px;"></textarea>
                        <textarea name="answer_AR" id="edit-answer-ar" class="form-control" placeholder="Answer (Arabic)" required style="min-height:60px;" dir="rtl"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this Q&A?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Add Q&A Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--container-bg); color:var(--input-color);">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Add New Q&A</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="add-form-modal">
                    <div class="modal-body d-flex flex-column gap-3">
                        <input type="text" name="question_EN" class="form-control" placeholder="Question (English)" required>
                        <input type="text" name="question_AR" class="form-control" placeholder="Question (Arabic)" required dir="rtl">
                        <textarea name="answer_EN" class="form-control" placeholder="Answer (English)" required style="min-height:60px;"></textarea>
                        <textarea name="answer_AR" class="form-control" placeholder="Answer (Arabic)" required style="min-height:60px;" dir="rtl"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Add Q&A</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Theme toggle (same logic as index.html)
    document.getElementById('theme-toggle').addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('protoai_theme', next);
        location.reload();
    });
    // Set theme on load
    (function() {
        const theme = localStorage.getItem('protoai_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    // Home button
    document.getElementById('admin-home-btn').addEventListener('click', function() {
        window.location.href = '/';
    });

    // Debug toggle button
    document.getElementById('debug-toggle').addEventListener('click', function() {
        fetch('/admin/debug/toggle', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                const icon = this.querySelector('i');
                if (data.debug_enabled) {
                    icon.className = 'fas fa-bug';
                    icon.style.color = '#ff6b6b';
                    this.title = 'Debug Mode ON - Click to disable';
                } else {
                    icon.className = 'fas fa-bug';
                    icon.style.color = '';
                    this.title = 'Debug Mode OFF - Click to enable';
                }
                alert(data.message);
            });
    });

    // Check debug status on load
    fetch('/admin/debug/status')
        .then(res => res.json())
        .then(data => {
            const debugBtn = document.getElementById('debug-toggle');
            const icon = debugBtn.querySelector('i');
            if (data.debug_enabled) {
                icon.style.color = '#ff6b6b';
                debugBtn.title = 'Debug Mode ON - Click to disable';
            } else {
                icon.style.color = '';
                debugBtn.title = 'Debug Mode OFF - Click to enable';
            }
        });

    // Q&A logic (multi-client)
    function getClientFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return (params.get('client_id') || '').trim();
    }

    function setClientInUrl(clientId) {
        const url = new URL(window.location.href);
        url.searchParams.set('client_id', clientId);
        window.history.replaceState({}, '', url.toString());
    }

    function getSelectedClientId() {
        return document.getElementById('client-select').value || 'youlearnt';
    }

    async function loadClients(preferredClientId = null) {
        const select = document.getElementById('client-select');
        const res = await fetch('/api/knowledge/clients');
        const payload = await res.json();
        const clients = payload.clients || [];

        if (!clients.length) {
            await fetch('/api/knowledge/clients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: 'youlearnt' })
            });
            return loadClients(preferredClientId || 'youlearnt');
        }

        select.innerHTML = '';
        clients.forEach(c => {
            const option = document.createElement('option');
            option.value = c.client_id;
            option.textContent = c.client_id;
            select.appendChild(option);
        });

        const selected = preferredClientId && [...select.options].some(o => o.value === preferredClientId)
            ? preferredClientId
            : select.options[0].value;
        select.value = selected;
        setClientInUrl(selected);
    }

    function fetchQA() {
        const clientId = getSelectedClientId();
        fetch(`/api/knowledge/entries?client_id=${encodeURIComponent(clientId)}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#qa-table tbody');
                tbody.innerHTML = '';
                const entries = data.entries || [];
                entries.forEach(row => {
                    tbody.innerHTML += `
                    <tr data-id="${row.ID}">
                        <td>${row.ID}</td>
                        <td><span class="question-en">${row.question_EN}</span></td>
                        <td><span class="question-ar" dir="rtl">${row.question_AR}</span></td>
                        <td><span class="answer-en">${row.answer_EN}</span></td>
                        <td><span class="answer-ar" dir="rtl">${row.answer_AR}</span></td>
                        <td class="actions">
                            <button class="edit btn btn-warning btn-sm me-1">Edit</button>
                            <button class="delete btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>`;
                });

                if (!entries.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No entries for this client yet.</td></tr>';
                }
            });
    }

    document.getElementById('client-select').addEventListener('change', function() {
        setClientInUrl(getSelectedClientId());
        fetchQA();
    });

    document.getElementById('create-client-btn').addEventListener('click', async function() {
        const input = document.getElementById('new-client-id');
        const client_id = (input.value || '').trim();
        if (!client_id) return;

        await fetch('/api/knowledge/clients', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id })
        });

        input.value = '';
        await loadClients(client_id);
        fetchQA();
    });

    loadClients(getClientFromUrl()).then(fetchQA);
    // Modal form submit
    document.getElementById('add-form-modal').onsubmit = function(e) {
        e.preventDefault();
        const form = e.target;
        fetch('/api/knowledge/entries', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                client_id: getSelectedClientId(),
                question_EN: form.question_EN.value,
                question_AR: form.question_AR.value,
                answer_EN: form.answer_EN.value,
                answer_AR: form.answer_AR.value
            })
        }).then(() => {
            form.reset();
            fetchQA();
            var modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
            modal.hide();
        });
    };
    document.querySelector('#qa-table').onclick = function(e) {
        const tr = e.target.closest('tr');
        const id = tr?.dataset.id;
        if (e.target.classList.contains('delete')) {
            // Show confirmation modal
            window.deleteId = id;
            var deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        }
        if (e.target.classList.contains('edit')) {
            // Show edit modal and fill values
            window.editId = id;
            const q_en = tr.querySelector('.question-en').textContent;
            const q_ar = tr.querySelector('.question-ar').textContent;
            const a_en = tr.querySelector('.answer-en').textContent;
            const a_ar = tr.querySelector('.answer-ar').textContent;
            document.getElementById('edit-question-en').value = q_en;
            document.getElementById('edit-question-ar').value = q_ar;
            document.getElementById('edit-answer-en').value = a_en;
            document.getElementById('edit-answer-ar').value = a_ar;
            var editModal = new bootstrap.Modal(document.getElementById('editModal'));
            editModal.show();
        }
    };

    // Edit modal form submit
    document.getElementById('edit-form-modal').onsubmit = function(e) {
        e.preventDefault();
        fetch(`/api/knowledge/entries/${window.editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                client_id: getSelectedClientId(),
                question_EN: document.getElementById('edit-question-en').value,
                question_AR: document.getElementById('edit-question-ar').value,
                answer_EN: document.getElementById('edit-answer-en').value,
                answer_AR: document.getElementById('edit-answer-ar').value
            })
        }).then(() => {
            fetchQA();
            var editModal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
            editModal.hide();
        });
    };

    // Delete modal confirm
    document.getElementById('confirm-delete-btn').onclick = function() {
        fetch(`/api/knowledge/entries/${window.deleteId}?client_id=${encodeURIComponent(getSelectedClientId())}`, { method: 'DELETE' })
            .then(() => {
                fetchQA();
                var deleteModal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                deleteModal.hide();
            });
    };
    </script>
</body>
</html>
